<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Eurotrip Planner</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="Eurotrip">
<meta name="theme-color" content="#14213d">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#eef2f5;--card:#fff;--ink:#14213d;--mute:#5b6678;--line:#d5dce4;--acc:#c8372d;--pine:#1f5c4d;--warn:#fff1d6;--warnink:#7a4a00;--bad:#fde4e1;--badink:#8f1d14;--ok:#dff3ea;--okink:#14503f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1624;--card:#18223a;--ink:#e8edf5;--mute:#98a3b8;--line:#2b3754;--acc:#ff6b5e;--pine:#6fcfb0;--warn:#3a2d10;--warnink:#f5cf85;--bad:#3d1b18;--badink:#ffb4ab;--ok:#13352c;--okink:#9ee3c9;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1624;--card:#18223a;--ink:#e8edf5;--mute:#98a3b8;--line:#2b3754;--acc:#ff6b5e;--pine:#6fcfb0;--warn:#3a2d10;--warnink:#f5cf85;--bad:#3d1b18;--badink:#ffb4ab;--ok:#13352c;--okink:#9ee3c9;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Bricolage Grotesque",system-ui,-apple-system,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 14px 96px}
h1{font-size:34px;line-height:1.05;margin:4px 0 4px;font-weight:800;letter-spacing:-.02em}
h2{font-size:20px;margin:22px 0 8px;font-weight:800}
h3{font-size:16px;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.hero{background:var(--ink);color:var(--bg);border-radius:20px;padding:20px;margin:6px 0 12px}
.hero .big{font-size:64px;font-weight:800;line-height:1;letter-spacing:-.03em}
.hero p{margin:6px 0 0;opacity:.8}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.grow{flex:1;min-width:0}
input,select,textarea{width:100%;min-height:46px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
label{display:block;font-size:14px;color:var(--mute);margin:8px 0 3px}
.g2{display:grid;min-width:0;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
button,.btn{min-height:46px;font:inherit;font-weight:600;border:0;border-radius:10px;padding:8px 14px;background:var(--acc);color:#fff;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
button.alt,.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.sm{min-height:38px;padding:4px 10px;font-size:14px}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--pine);outline-offset:2px}
.tag{display:inline-block;font-size:13px;font-weight:600;border-radius:99px;padding:2px 10px}
.t-ok{background:var(--ok);color:var(--okink)}.t-warn{background:var(--warn);color:var(--warnink)}.t-bad{background:var(--bad);color:var(--badink)}.t-n{background:var(--bg);color:var(--mute);border:1px solid var(--line)}
.note{border-radius:12px;padding:10px 12px;margin:8px 0;font-size:15px}
.bar{height:12px;background:var(--bg);border-radius:9px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--pine)}
.bar i.over{background:var(--acc)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;background:transparent;color:var(--mute);border-radius:10px;font-size:11.5px;min-height:50px;flex-direction:column;padding:4px}
nav button.on{color:var(--acc);background:var(--bg)}
a{color:var(--acc)}
#map{height:280px;border-radius:12px;border:1px solid var(--line);margin:10px 0;z-index:0}
.act{border-left:4px solid var(--pine);padding:4px 0 4px 10px;margin:8px 0}
.done{text-decoration:line-through;color:var(--mute)}
.chk{display:flex;gap:10px;align-items:center;min-height:44px}
.chk input{width:24px;min-height:24px;height:24px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.statusline{font-size:12px;color:var(--mute);padding:4px 0 12px}
dialog{width:min(94vw,560px);max-height:90dvh;overflow:auto;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:20px}dialog::backdrop{background:#0009}dialog h2{margin-top:0}#edit-error{color:var(--badink)}details{font-size:14px}select{max-width:100%}
input,select,textarea{min-width:0;max-width:100%} .g2>div{min-width:0}
</style></head><body>
<main id="app"></main>
<nav id="nav"></nav>
<script src="app.js"></script>
<script src="planner.js"></script>
<script src="live-ui.js"></script>
<script src="connections.js"></script>
<script src="rail-ui.js"></script>
</body></html>
